name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Tag matches the built version
        shell: pwsh
        run: |
          $identity = Get-Content artifacts/validation/build-identity.json -Raw | ConvertFrom-Json
          if ("v$($identity.version)" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $($identity.version)." }
          "Application SHA-256: $($identity.helperSha256)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Headless, layout and fake-target checks
        shell: pwsh
        run: ./scripts/test.ps1 -NoBuild
      - name: Verify formatting
        shell: pwsh
        run: dotnet format NinjaTraderLogin.sln --no-restore --verify-no-changes
      - name: Packaging regression checks
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Portable shortcut checks
        shell: pwsh
        run: ./scripts/test-portability.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -NoBuild
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.zip
            artifacts/bin/NinjaTraderAutoLogin/Release/net48/NinjaTraderAutoLogin.exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          $assets = @(Get-ChildItem artifacts/packages -File | ForEach-Object { $_.FullName })
          # A version with a suffix, such as 0.1.0-rc.1, is published as a pre-release.
          $prerelease = if ($version.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag @prerelease --title "Auto Login for NinjaTrader $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
