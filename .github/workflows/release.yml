name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # A rehearsal runs every check and builds the package for the selected branch, then stops
  # before attestation and publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release source is on main
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw "Not a release tag: $env:RELEASE_TAG" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          $onMain = $LASTEXITCODE -eq 0
          if (-not $onMain -and $env:REHEARSAL -ne 'true') { throw "Commit $env:GITHUB_SHA is not on main; a release is published only from main." }
          if (-not $onMain) { "::warning::Rehearsal of a commit that is not on main yet; a real release from it would be refused." }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Tag matches the built version
        shell: pwsh
        run: |
          $identity = Get-Content artifacts/validation/build-identity.json -Raw | ConvertFrom-Json
          if ("v$($identity.version)" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match version $($identity.version)." }
          $notes = "docs/release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          "Application SHA-256: $($identity.helperSha256)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Headless, layout and fake-target checks
        shell: pwsh
        run: ./scripts/test.ps1 -NoBuild
      - name: Verify formatting
        shell: pwsh
        run: dotnet format NinjaTraderLogin.sln --no-restore --verify-no-changes
      - name: Packaging regression checks
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Portable shortcut checks
        shell: pwsh
        run: ./scripts/test-portability.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -NoBuild
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.REHEARSAL != 'true'
        with:
          subject-path: |
            artifacts/packages/*.zip
            artifacts/bin/NinjaTraderAutoLogin/Release/net48/NinjaTraderAutoLogin.exe
      - name: Publish the release
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $notes = "docs/release-notes/$env:RELEASE_TAG.md"
          $assets = @(Get-ChildItem artifacts/packages -File | ForEach-Object { $_.FullName })
          # A version with a suffix, such as 0.1.0-rc.1, is published as a pre-release.
          # Kept as an array: a one-item result of `if` becomes a string, which splatting
          # would split into single characters.
          $prerelease = @()
          if ($version.Contains('-')) { $prerelease += '--prerelease' }
          $arguments = @('release', 'create', $env:RELEASE_TAG) + $assets + @('--verify-tag') + $prerelease + @('--title', "Auto Login for NinjaTrader $version", '--notes-file', $notes)
          if ($env:REHEARSAL -eq 'true') {
            # Shows exactly what a real release would run, without running it.
            "Rehearsal only; nothing was published. A release would run:" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            'gh ' + (($arguments | ForEach-Object { if ($_ -match '\s') { '"' + $_ + '"' } else { $_ } }) -join ' ') | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-ChildItem artifacts/packages -File | ForEach-Object { "$($_.Name)  $((Get-FileHash -LiteralPath $_.FullName).Hash)" } | Add-Content $env:GITHUB_STEP_SUMMARY
            return
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
